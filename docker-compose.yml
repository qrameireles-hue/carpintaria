version: "3.8"
services:
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    restart: unless-stopped
    environment:
      TZ: "UTC"
    volumes:
      - ./src:/var/www/app:rw
      - ./config/php/php.ini:/usr/local/etc/php/php.ini:ro
      - ./config/php-fpm/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
    networks: [internal]
    depends_on: [db]
  web:
    image: nginx:1.24-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/app:ro
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [internal]
    depends_on: [app]
  db:
    image: mariadb:10.5
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: change_root
      MYSQL_DATABASE: carpentry
      MYSQL_USER: carpuser
      MYSQL_PASSWORD: change_app
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [internal]
  adminer:
    image: adminer:4
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks: [internal]
networks: { internal: {} }
volumes: { db_data: {} }
